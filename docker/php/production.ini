; Overrides on top of PHP's php.ini-production.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Catalogue uploads (config/catalog.php): up to 12 images of 10 MB each.
upload_max_filesize = 10M
max_file_uploads = 12
post_max_size = 128M
; GD decodes up to 6000x6000 px images before re-encoding them to WebP.
memory_limit = 256M

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 20000
; Code never changes inside a running container.
opcache.validate_timestamps = 0
