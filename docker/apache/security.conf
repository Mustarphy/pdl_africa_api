# Avoids the "could not reliably determine the server's FQDN" warning; the
# virtual host answers on any host name.
ServerName localhost

# Do not advertise versions.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Memory-bounded worker count for small instances (mod_php + prefork):
# Render's free instance has 512 MB; image processing can use ~256 MB per
# request (docker/php/production.ini).
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       8
    MaxConnectionsPerChild  500
</IfModule>
