# Laravel API virtual host. ${PORT} is read from the environment when Apache
# starts (Render sets it; the image defaults to 10000).
<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # public/.htaccess routes every request to index.php.
        AllowOverride All
        Require all granted
    </Directory>

    # Containers log to stdout/stderr.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
